allowBuilds:
  esbuild: true
  unrs-resolver: false

catalog:
  '@gtbuchanan/eslint-config': 0.5.2
  '@gtbuchanan/tsconfig': 0.2.0
  '@pnpm/types': 1102.1.0
  '@types/node': 26.4.1
  eslint: 10.9.1
  typescript: 6.0.3

catalogs:
  globals:
    # eslint-disable pnpm/yaml-no-unused-catalog-item -- consumed by the chezmoi pnpm-globals template, not a package.json
    '@bitwarden/cli': 2026.8.0
    '@openai/codex': 0.150.1
    '@playwright/cli': 0.1.18
    '@pnp/cli-microsoft365': 11.10.0
    '@readonly-mcp/core': github:readonly-mcp/core#6c14823a4159b1bf9b821dd3d8334ec477852f1a
    '@vtsls/language-server': 0.3.0
    '@vue/language-server': 2.2.12
    bitwarden-cli-bio: 1.4.2
    tweakcc: 4.3.3
    vscode-langservers-extracted: 4.10.0
    # eslint-enable pnpm/yaml-no-unused-catalog-item

engineStrict: true

hoist: false

lockfileIncludeTarballUrl: false

# 4320 minutes = 3 days, matching the shared Renovate preset's quarantine.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@gtbuchanan/*'

strictPeerDependencies: true
