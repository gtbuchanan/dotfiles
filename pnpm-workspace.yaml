allowBuilds:
  esbuild: true
  unrs-resolver: false

catalog:
  '@gtbuchanan/eslint-config': 0.5.2
  '@gtbuchanan/tsconfig': 0.2.0
  '@pnpm/types': 1102.1.2
  '@types/node': 26.6.5
  eslint: 10.13.0
  typescript: 6.0.3

catalogs:
  globals:
    # eslint-disable pnpm/yaml-no-unused-catalog-item -- consumed by the chezmoi pnpm-globals template, not a package.json
    '@bitwarden/cli': 2026.10.0
    '@openai/codex': 0.164.0
    '@playwright/cli': 0.1.22
    '@pnp/cli-microsoft365': 11.11.0
    '@readonly-mcp/server': 1.0.0
    '@vtsls/language-server': 0.3.0
    '@vue/language-server': 2.2.12
    bitwarden-cli-bio: 1.4.2
    tweakcc: 4.3.3
    vscode-langservers-extracted: 4.10.0
    # eslint-enable pnpm/yaml-no-unused-catalog-item

engineStrict: true

hoist: false

lockfileIncludeTarballUrl: false

# 4320 minutes = 3 days, matching the shared Renovate preset's quarantine.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@gtbuchanan/*'

strictPeerDependencies: true
