---
# Run the host-native checks on each hosted OS. The leaves behind `test:fast`
# self-select — the template render checks only what `chezmoi ignored` deploys
# on this OS — so every leg covers its own platform's branches, which a
# single-OS runner cannot give. android has no hosted runner and is covered by
# the termux leg instead.
#
# Named for the tier, not for what it runs, so coverage can be added without
# touching this file: a leaf joins test:fast's `depends` and these jobs pick it
# up. Renaming them means updating the branch ruleset, which pins its required
# checks to these exact context names.
#
# Reusable so both pr.yml (pre-merge) and release.yml (post-integration on
# main) share one definition. These checks are full-tree, not diff-based, so
# unlike pre-commit they run meaningfully on a push to main.
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: gtbuchanan/tooling/.github/actions/mise-setup@main
      - run: mise run test:fast
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

  # android has no hosted runner, so borrow a Termux userland from
  # termux/termux-docker (native x86_64 image on the x64 runner — no QEMU).
  # The same leaves as the matrix above, with the android branches active.
  test-termux:
    name: Test (android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: gtbuchanan/tooling/.github/actions/mise-setup@main
      - run: mise run test:termux

name: CI

on:
  workflow_call: {}

permissions:
  contents: read
