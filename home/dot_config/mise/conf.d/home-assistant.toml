# Personal-host mise fragment, deployed by the conf.d/.chezmoiignore gate.
#
# The Home Assistant CLI is pinned in mise's global namespace, and it earns that
# exception by not being a dev toolchain: it's a user-facing application, so no
# project mise.toml would ever pin it and nothing downstream can be shadowed by
# it. Dev tool versions stay per-project — see docs/mise.md.
#
# Installed through mise's `pipx:` backend, whose engine (uv) is pinned in
# uv.toml — shared across every `pipx:` entry rather than owned by this one.
#
# Plain TOML rather than a chezmoi template, so Renovate's mise manager parses
# the version below directly — see docs/mise.md. The table form keeps that
# working; Renovate reads `version` out of it.
#
# The postinstall repairs the tool venv against Python 3.14, which drops the
# implicit event loop hass-cli 1.0.0 still expects. It hangs off the install
# rather than living in a chezmoi script because it writes into a directory mise
# owns and discards on any reinstall or version bump. The command it names
# resolves on every platform — a shell script on Unix, a .cmd on Windows, where
# it is deliberately a no-op — because this fragment is plain TOML and cannot
# gate itself by OS. See docs/home-assistant.md.
[tools]
"pipx:homeassistant-cli" = { version = "1.0.0", postinstall = "hass-cli-postinstall" }
