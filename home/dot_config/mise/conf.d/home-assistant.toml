# Personal-host mise fragment, deployed by the conf.d/.chezmoiignore gate.
#
# The Home Assistant CLI is pinned in mise's global namespace, and it earns that
# exception by not being a dev toolchain: it's a user-facing application, so no
# project mise.toml would ever pin it and nothing downstream can be shadowed by
# it. Dev tool versions stay per-project — see docs/mise.md.
#
# Installed through mise's `pipx:` backend, whose engine (uv) is pinned in
# uv.toml — shared across every `pipx:` entry rather than owned by this one.
#
# Plain TOML rather than a chezmoi template, so Renovate's mise manager parses
# the version below directly — see docs/mise.md.
[tools]
"pipx:homeassistant-cli" = "1.0.0"
