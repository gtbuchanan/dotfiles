# uv, pinned globally on every host.
#
# mise's pipx backend shells out to `uv tool install`, and neither uv nor pipx
# is otherwise present on Windows, so every `pipx:` entry in this directory
# depends on this pin. It sits in its own fragment rather than beside any one of
# those entries so the pin isn't scoped to a single application's lifetime.
#
# On Termux the pin is inert: the mise-managed uv has no android asset and is
# disabled in termux.toml, leaving Termux's own `pkg` build to serve from PATH.
#
# Plain TOML rather than a chezmoi template, so Renovate's mise manager parses
# the version below directly — see docs/mise.md.
[tools]
uv = "0.12.9"
