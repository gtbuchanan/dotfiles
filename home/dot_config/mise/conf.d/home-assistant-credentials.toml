# Home Assistant CLI credentials, resolved from the Bitwarden vault.
#
# Split from home-assistant.toml because the two have different deploy gates and
# a plain-TOML fragment can't carry a `{{ if }}`: the version pin ships to every
# personal host, this ships only to personal Windows, the one platform with a
# resolver so far. The others are unimplemented, not opted out — when each grows
# a resolver its platform joins the gate below.
#
# Until then they must not get these entries at all. `|| exit 0` turns a missing
# resolver into an *empty* value rather than no value, and mise exports that —
# so a merged fragment would actively set HASS_SERVER="" and HASS_TOKEN="" on
# those hosts, overriding anything set another way. Absent beats empty.
#
# hass-cli takes its server and token from the environment on every invocation
# and reads no config file, so something has to put them there. Doing it in mise
# rather than a shell wrapper is what makes it work for non-interactive callers:
# a wrapper only exists in shells that loaded a profile, so agent harnesses and
# scripts resolve the mise shim directly and get nothing. `[env]` is evaluated
# by the shim too, so every caller is covered — activated shells, `mise exec`,
# scripts, and agents alike.
#
# Exported rather than passed as `--server` / `--token` flags, which would put a
# long-lived token in the command line where any process listing can read it.
#
# `redact` keeps the values out of `mise env`, `mise doctor`, and task output.
# It does not keep them from the process hass-cli runs in, which is the point.
#
# `|| exit 0` makes a failed lookup yield an empty value instead of an error.
# Without it a locked vault, a renamed item, or an offline `bw` would fail every
# mise command on the host, not just hass-cli. The cost is that an unresolved
# credential is silent — mise swallows an `[env]` exec's stderr — so hass-cli
# falls back to zeroconf and reports it cannot find Home Assistant. Run
# `hass-vault check` to see the real reason; it resolves the same way without
# printing either credential, which is what the entries below do on purpose.
[env]
HASS_SERVER = { value = "{{ exec(command='hass-vault server || exit 0') }}", redact = true }
HASS_TOKEN = { value = "{{ exec(command='hass-vault token || exit 0') }}", redact = true }

[settings]
# Caches the computed environment so an activated shell doesn't re-run both
# resolvers on every directory change. A second cache above the resolver's own:
# that one avoids the vault round trip (~11s cold, ~0.1s warm), this one avoids
# spawning the resolver at all. Session-scoped — it does not engage on the
# shims-only path non-interactive callers take, which is why the resolver has to
# be cheap on its own rather than leaning on this.
#
# Staleness is harmless here: Home Assistant long-lived tokens don't rotate, so
# a cached value can't go bad within the window the way an expiring OAuth token
# would.
env_cache_ttl = "15m"
