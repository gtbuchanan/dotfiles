# Windows and Linux. macOS and Termux take mise from a package manager that
# tracks upstream closely (Homebrew, `pkg`). winget's jdx.mise manifest sat six
# releases and eight days behind upstream, and mise.run installed the latest
# build once and never upgraded it. Installed by the
# run_onchange_before_install-mise script under each platform's
# .chezmoiscripts/ directory.
#
---
# renovate: datasource=github-releases depName=jdx/mise
mise_version: '2026.10.23'
