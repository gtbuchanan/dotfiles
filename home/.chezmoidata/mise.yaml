# that tracks upstream closely (mise.run, Homebrew, Termux `pkg`), so only this
# one is pinned. winget's jdx.mise manifest is the outlier: it sat six releases
# and eight days behind upstream, which put newly shipped settings out of reach
# on the platform that needed them. Installed by
# .chezmoiscripts/windows/run_onchange_before_install-mise.ps1.tmpl.
#
